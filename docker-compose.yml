services:
  # ---------- PostgreSQL ----------
  db:
    image: postgres:16-alpine
    container_name: maintenance-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-maintenance}
      POSTGRES_USER: ${DB_USER:-maintenance}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-maintenance_secret}
      PGDATA: /var/lib/postgresql/data/pgdata
    # Порт открыт для разработки/тестов с хоста. В продакшене можно убрать.
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${DB_USER:-maintenance} -d ${DB_NAME:-maintenance}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - backend

  # ---------- API (Node.js) ----------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: maintenance-api:latest
    container_name: maintenance-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # Порт НЕ публикуем наружу — только через nginx
    expose:
      - '3000'
    environment:
      NODE_ENV: production
      PORT: 3000
      TRUST_PROXY: '1'

      # База данных
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-maintenance}
      DB_USER: ${DB_USER:-maintenance}
      DB_PASSWORD: ${DB_PASSWORD:-maintenance_secret}
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      DB_POOL_MIN: ${DB_POOL_MIN:-0}
      DB_POOL_ACQUIRE: ${DB_POOL_ACQUIRE:-30000}
      DB_POOL_IDLE: ${DB_POOL_IDLE:-10000}

      # JWT / Auth
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev_access_secret_change_me}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev_refresh_secret_change_me}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-10}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}

      # CORS
      CORS_ORIGINS: ${CORS_ORIGINS:-https://localhost,http://localhost,http://localhost:3000,http://localhost:5173}

      # Rate limiting
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-100}

      # Внешние API
      WEATHER_API_URL: ${WEATHER_API_URL:-https://api.open-meteo.com/v1/forecast}
      GEOCODING_API_URL: ${GEOCODING_API_URL:-https://geocoding-api.open-meteo.com/v1/search}
      REQUEST_TIMEOUT_MS: ${REQUEST_TIMEOUT_MS:-5000}
      WEATHER_MAX_WIND_MS: ${WEATHER_MAX_WIND_MS:-10}
      WEATHER_MAX_PRECIPITATION_MM: ${WEATHER_MAX_PRECIPITATION_MM:-0.5}

      # Логи
      LOG_LEVEL: ${LOG_LEVEL:-info}
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:3000/api/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - backend

  # ---------- Nginx (reverse proxy + HTTPS) ----------
  nginx:
    image: nginx:1.27-alpine
    container_name: maintenance-nginx
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./deploy/nginx/certs:/etc/nginx/certs:ro
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost/nginx-health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - backend

  # ---------- Prometheus ----------
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: maintenance-prometheus
    restart: unless-stopped
    depends_on:
      - api
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    expose:
      - '9090'
    networks:
      - backend

  # ---------- Grafana ----------
  grafana:
    image: grafana/grafana:11.3.0
    container_name: maintenance-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
      - db
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_SERVER_ROOT_URL: '%(protocol)s://%(domain)s/grafana/'
      GF_SERVER_SERVE_FROM_SUB_PATH: 'true'
      GF_USERS_ALLOW_SIGN_UP: 'false'
      # Для Grafana Postgres datasource
      DB_NAME: ${DB_NAME:-maintenance}
      DB_USER: ${DB_USER:-maintenance}
      DB_PASSWORD: ${DB_PASSWORD:-maintenance_secret}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    expose:
      - '3000'
    networks:
      - backend

volumes:
  postgres-data:
  grafana-data:
  prometheus-data:

networks:
  backend:
    driver: bridge
